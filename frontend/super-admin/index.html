<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Super Admin Platform Control Center | Pramo Jewels</title>
  <meta name="description" content="Super Admin platform control center. Global RBAC user management, system audit logs, security lockdown, and pricing overrides.">
  <link rel="stylesheet" href="../src/styles/main.css">
</head>
<body class="bg-[#F8F6F2] text-[#1F1F1F]">

  <!-- Header Placeholder -->
  <div id="header-container"></div>

  <!-- Super Admin Portal Banner -->
  <section class="bg-[#1F1F1F] text-[#F8F6F2] py-8 px-4 sm:px-6 lg:px-8 border-b border-[#9E7C42]">
    <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
      <div>
        <span class="text-xs uppercase tracking-widest text-[#9E7C42] font-bold">SUPREME SYSTEM AUTHORITY</span>
        <h1 class="font-serif text-3xl font-light text-[#F8F6F2]">Super Admin Control Center</h1>
      </div>
      <div class="flex gap-3">
        <button id="lockdown-toggle-btn" class="px-4 py-2 bg-[#A33A3A] text-white rounded text-xs font-bold uppercase tracking-wider">
          ACTIVATE EMERGENCY LOCKDOWN
        </button>
        <button id="gold-index-btn" class="gold-btn px-4 py-2 rounded text-xs font-semibold uppercase tracking-wider">
          OVERRIDE PRICING INDEX
        </button>
      </div>
    </div>
  </section>

  <!-- Main Super Admin Layout -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 space-y-10">
    
    <!-- Role & Privilege Governance Section -->
    <div class="bg-white p-6 rounded-lg border border-[#D7D0C5] shadow-sm space-y-6">
      <h2 class="font-serif text-xl font-semibold text-[#1F1F1F]">RBAC User & Administrator Management</h2>
      
      <form id="grant-role-form" class="grid grid-cols-1 sm:grid-cols-3 gap-4 text-xs">
        <div>
          <label class="block text-[#5F5F5F] font-semibold mb-1">Target User Email</label>
          <input type="email" id="role-email" required placeholder="e.g. manager@pramojewels.com" class="w-full border border-[#D7D0C5] rounded p-2.5 outline-none focus:border-[#C7A76C]">
        </div>
        <div>
          <label class="block text-[#5F5F5F] font-semibold mb-1">Assign Role Level</label>
          <select id="role-select" class="w-full border border-[#D7D0C5] rounded p-2.5 outline-none focus:border-[#C7A76C]">
            <option value="admin">Store Manager (Admin)</option>
            <option value="super_admin">Platform Owner (Super Admin)</option>
            <option value="customer">Customer (Revoke Admin Access)</option>
          </select>
        </div>
        <div class="flex items-end">
          <button type="submit" class="w-full gold-btn py-2.5 rounded text-xs font-semibold uppercase tracking-wider">
            UPDATE USER PERMISSIONS
          </button>
        </div>
      </form>
    </div>

    <!-- Platform Audit Logs Stream -->
    <div class="bg-white p-6 rounded-lg border border-[#D7D0C5] shadow-sm space-y-4">
      <div class="flex justify-between items-center">
        <h2 class="font-serif text-xl font-semibold text-[#1F1F1F]">Real-time Security & Audit Logs</h2>
        <span class="text-xs text-[#6F8F72] font-semibold flex items-center gap-1">
          <i data-lucide="activity" class="w-4 h-4"></i> Live Audit Feed
        </span>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs">
          <thead>
            <tr class="bg-[#EDE7DD] text-[#1F1F1F] uppercase font-semibold">
              <th class="p-3">Timestamp</th>
              <th class="p-3">Actor / Entity</th>
              <th class="p-3">Action Description</th>
              <th class="p-3">Result Status</th>
              <th class="p-3">Client IP</th>
            </tr>
          </thead>
          <tbody id="audit-logs-tbody"></tbody>
        </table>
      </div>
    </div>

  </main>

  <!-- Footer & Modals -->
  <div id="footer-container"></div>
  <div id="cart-drawer-container"></div>

  <!-- Entry Script -->
  <script type="module">
    import { renderHeader } from '../src/components/header.js';
    import { renderFooter } from '../src/components/footer.js';
    import { renderCartDrawer } from '../src/components/modal.js';
    import { SuperAdminEngine } from '../src/scripts/superAdmin.js';

    document.addEventListener('DOMContentLoaded', () => {
      renderHeader();
      renderFooter();
      renderCartDrawer();
      SuperAdminEngine.init();
    });
  </script>
</body>
</html>
