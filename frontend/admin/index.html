<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Store Manager Admin Portal | Pramo Jewels</title>
  <meta name="description" content="Pramo Jewels Store Manager Operations Portal. Catalog management, order processing, and inventory control.">
  <link rel="stylesheet" href="../src/styles/main.css">
</head>
<body class="bg-[#F8F6F2] text-[#1F1F1F]">

  <!-- Header Placeholder -->
  <div id="header-container"></div>

  <!-- Admin Portal Banner -->
  <section class="bg-[#1F1F1F] text-[#F8F6F2] py-8 px-4 sm:px-6 lg:px-8">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <div>
        <span class="text-xs uppercase tracking-widest text-[#C7A76C] font-semibold">STORE MANAGER PORTAL</span>
        <h1 class="font-serif text-3xl font-light text-[#F8F6F2]">Catalog & Order Management</h1>
      </div>
      <a href="/super-admin/index.html" class="gold-outline-btn border-[#C7A76C] text-[#C7A76C] px-4 py-2 rounded text-xs font-semibold">
        Switch to Super Admin Portal →
      </a>
    </div>
  </section>

  <!-- Main Admin Layout -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 space-y-10">
    
    <!-- Metrics Cards -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-6">
      <div class="bg-white p-6 rounded-lg border border-[#D7D0C5] shadow-sm">
        <span class="text-xs text-[#5F5F5F] font-semibold uppercase">Total Store Revenue</span>
        <h3 id="stat-revenue" class="font-serif text-3xl font-bold text-[#1F1F1F] mt-1">$0</h3>
      </div>
      <div class="bg-white p-6 rounded-lg border border-[#D7D0C5] shadow-sm">
        <span class="text-xs text-[#5F5F5F] font-semibold uppercase">Active Orders</span>
        <h3 id="stat-orders" class="font-serif text-3xl font-bold text-[#1F1F1F] mt-1">0</h3>
      </div>
      <div class="bg-white p-6 rounded-lg border border-[#D7D0C5] shadow-sm">
        <span class="text-xs text-[#5F5F5F] font-semibold uppercase">Catalog Products</span>
        <h3 id="stat-products" class="font-serif text-3xl font-bold text-[#1F1F1F] mt-1">0</h3>
      </div>
    </div>

    <!-- Product Catalog Table Section -->
    <div class="bg-white p-6 rounded-lg border border-[#D7D0C5] space-y-4 shadow-sm">
      <div class="flex justify-between items-center">
        <h2 class="font-serif text-xl font-semibold text-[#1F1F1F]">Fine Jewellery Product Catalog</h2>
        <button id="add-product-btn" class="gold-btn px-4 py-2 rounded text-xs font-semibold uppercase tracking-wider">
          + Add New Jewellery Piece
        </button>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs">
          <thead>
            <tr class="bg-[#EDE7DD] text-[#1F1F1F] uppercase font-semibold">
              <th class="p-3">Product Name</th>
              <th class="p-3">Category</th>
              <th class="p-3">Price</th>
              <th class="p-3">Stock Level</th>
              <th class="p-3">Actions</th>
            </tr>
          </thead>
          <tbody id="admin-catalog-tbody"></tbody>
        </table>
      </div>
    </div>

    <!-- Recent Orders Section -->
    <div class="bg-white p-6 rounded-lg border border-[#D7D0C5] space-y-4 shadow-sm">
      <h2 class="font-serif text-xl font-semibold text-[#1F1F1F]">Recent Store Orders</h2>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs">
          <thead>
            <tr class="bg-[#EDE7DD] text-[#1F1F1F] uppercase font-semibold">
              <th class="p-3">Order ID</th>
              <th class="p-3">Customer</th>
              <th class="p-3">Date</th>
              <th class="p-3">Total Amount</th>
              <th class="p-3">Status</th>
            </tr>
          </thead>
          <tbody id="admin-orders-tbody"></tbody>
        </table>
      </div>
    </div>

  </main>

  <!-- Footer & Modals -->
  <div id="footer-container"></div>
  <div id="cart-drawer-container"></div>

  <!-- Entry Script -->
  <script type="module">
    import { renderHeader } from '../src/components/header.js';
    import { renderFooter } from '../src/components/footer.js';
    import { renderCartDrawer } from '../src/components/modal.js';
    import { AdminEngine } from '../src/scripts/admin.js';

    document.addEventListener('DOMContentLoaded', () => {
      renderHeader();
      renderFooter();
      renderCartDrawer();
      AdminEngine.init();
    });
  </script>
</body>
</html>
