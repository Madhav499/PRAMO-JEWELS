<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fine Jewellery Catalog | Pramo Jewels</title>
  <meta name="description" content="Browse Pramo Jewels high jewellery collections. Solitaire rings, emerald necklaces, diamond tennis bracelets, and luxury pendants.">
  <script type="module" crossorigin src="/assets/userShop-CSb1bE8j.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/modal-Bwvivhk1.js">
  <link rel="stylesheet" crossorigin href="/assets/main-CQnqZ1Ug.css">
</head>
<body class="bg-[#F8F6F2] text-[#1F1F1F]">

  <!-- Header Placeholder -->
  <div id="header-container"></div>

  <!-- Page Banner Header -->
  <section class="bg-[#EDE7DD] py-12 px-4 border-b border-[#D7D0C5] text-center">
    <div class="max-w-4xl mx-auto space-y-2">
      <span class="text-xs uppercase tracking-[0.3em] text-[#9E7C42] font-semibold">HAUTE JOAILLERIE</span>
      <h1 class="font-serif text-4xl sm:text-5xl font-light text-[#1F1F1F]">Fine Jewellery Collection</h1>
      <p class="text-xs text-[#5F5F5F] max-w-md mx-auto">Explore hand-selected solitaire diamonds, solid 18K gold settings, and certified gemstones.</p>
    </div>
  </section>

  <!-- Main Shop Layout -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
    
    <!-- Top Filter Control Bar -->
    <div class="flex flex-wrap items-center justify-between gap-4 pb-6 mb-8 border-b border-[#D7D0C5] text-xs">
      <div class="flex items-center gap-4">
        <span id="catalog-count" class="font-semibold text-[#1F1F1F]">Loading Items...</span>
      </div>

      <div class="flex items-center gap-6">
        <!-- Sort Dropdown -->
        <div class="flex items-center gap-2">
          <span class="text-[#5F5F5F] uppercase tracking-wider">Sort By:</span>
          <select id="sort-filter" class="bg-white border border-[#D7D0C5] rounded px-3 py-1.5 text-xs text-[#1F1F1F] outline-none cursor-pointer">
            <option value="featured">Featured Collections</option>
            <option value="price-low">Price: Low to High</option>
            <option value="price-high">Price: High to Low</option>
            <option value="rating">Highest Rated</option>
          </select>
        </div>

        <!-- Grid Layout Switchers -->
        <div class="hidden sm:flex items-center border border-[#D7D0C5] rounded bg-white p-1">
          <button id="grid-2col" class="p-1.5 text-[#5F5F5F] hover:text-[#1F1F1F]" title="Editorial 2-Column Grid">
            <i data-lucide="grid-2x2" class="w-4 h-4"></i>
          </button>
          <button id="grid-4col" class="p-1.5 text-[#1F1F1F] hover:text-[#C7A76C]" title="Standard 4-Column Grid">
            <i data-lucide="grid-3x3" class="w-4 h-4"></i>
          </button>
        </div>
      </div>
    </div>

    <!-- Sidebar + Grid Container -->
    <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
      
      <!-- Filter Sidebar -->
      <aside class="space-y-8 bg-white p-6 rounded-lg border border-[#D7D0C5] h-fit">
        <div>
          <h3 class="font-serif text-base font-semibold text-[#1F1F1F] pb-3 border-b border-[#EDE7DD]">Categories</h3>
          <div class="mt-4 space-y-2 text-xs">
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="radio" name="cat" value="all" id="category-filter" checked class="accent-[#C7A76C]">
              <span>All Fine Jewellery</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="radio" name="cat" value="rings" class="accent-[#C7A76C]">
              <span>Solitaire Rings</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="radio" name="cat" value="necklaces" class="accent-[#C7A76C]">
              <span>Haute Necklaces</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="radio" name="cat" value="bracelets" class="accent-[#C7A76C]">
              <span>Tennis Bracelets</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="radio" name="cat" value="earrings" class="accent-[#C7A76C]">
              <span>South Sea Earrings</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="radio" name="cat" value="pendants" class="accent-[#C7A76C]">
              <span>Sapphire Pendants</span>
            </label>
          </div>
        </div>

        <!-- Price Range Slider -->
        <div>
          <h3 class="font-serif text-base font-semibold text-[#1F1F1F] pb-3 border-b border-[#EDE7DD]">Max Price</h3>
          <div class="mt-4 space-y-3">
            <input type="range" id="price-range" min="1000" max="15000" step="500" value="10000" class="w-full accent-[#C7A76C]">
            <div class="flex justify-between text-xs font-semibold text-[#1F1F1F]">
              <span>$1,000</span>
              <span id="price-val">$10,000</span>
            </div>
          </div>
        </div>

        <!-- Precious Metals -->
        <div>
          <h3 class="font-serif text-base font-semibold text-[#1F1F1F] pb-3 border-b border-[#EDE7DD]">Metal Preference</h3>
          <div class="mt-4 space-y-2 text-xs">
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="checkbox" checked class="accent-[#C7A76C]">
              <span>18K Yellow Gold</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="checkbox" checked class="accent-[#C7A76C]">
              <span>950 Solid Platinum</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="checkbox" checked class="accent-[#C7A76C]">
              <span>18K Rose Gold</span>
            </label>
          </div>
        </div>
      </aside>

      <!-- Main Product Grid -->
      <section class="lg:col-span-3">
        <div id="product-grid"></div>
      </section>
    </div>
  </main>

  <!-- Footer & Modals -->
  <div id="footer-container"></div>
  <div id="cart-drawer-container"></div>

  <!-- Entry Script -->
</body>
</html>
