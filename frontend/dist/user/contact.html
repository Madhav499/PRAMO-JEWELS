<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact & Bespoke Atelier | Pramo Jewels</title>
  <meta name="description" content="Book a private 1-on-1 consultation with Pramo master jewellers or contact our luxury concierge service.">
  <script type="module" crossorigin src="/assets/userContact-BmCJaEgu.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/modal-Bwvivhk1.js">
  <link rel="stylesheet" crossorigin href="/assets/main-CQnqZ1Ug.css">
</head>
<body class="bg-[#F8F6F2] text-[#1F1F1F]">

  <!-- Header Placeholder -->
  <div id="header-container"></div>

  <section class="bg-[#EDE7DD] py-12 px-4 border-b border-[#D7D0C5] text-center">
    <span class="text-xs uppercase tracking-widest text-[#9E7C42] font-semibold">PRIVATE CONCIERGE & ATELIER</span>
    <h1 class="font-serif text-4xl font-light text-[#1F1F1F] mt-1">Book A Private Consultation</h1>
    <p class="text-xs text-[#5F5F5F] max-w-md mx-auto mt-2">Schedule an in-store private suite appointment or a virtual 1-on-1 high jewellery design session.</p>
  </section>

  <main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
    <div class="bg-white p-8 rounded-lg border border-[#D7D0C5] shadow-xl space-y-6">
      <form id="atelier-form" class="space-y-6">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-xs">
          <div>
            <label class="block text-[#5F5F5F] font-semibold mb-1">Your Full Name</label>
            <input type="text" required placeholder="e.g. Elizabeth Taylor" class="w-full border border-[#D7D0C5] rounded p-3 outline-none focus:border-[#C7A76C]">
          </div>
          <div>
            <label class="block text-[#5F5F5F] font-semibold mb-1">Email Address</label>
            <input type="email" required placeholder="e.g. elizabeth@domain.com" class="w-full border border-[#D7D0C5] rounded p-3 outline-none focus:border-[#C7A76C]">
          </div>
          <div>
            <label class="block text-[#5F5F5F] font-semibold mb-1">Session Type</label>
            <select class="w-full border border-[#D7D0C5] rounded p-3 outline-none focus:border-[#C7A76C]">
              <option value="bespoke">Bespoke Custom Engagement Ring Design</option>
              <option value="high-jewellery">High Jewellery High Gala Selection</option>
              <option value="restoration">Heritage Restoration & Polishing</option>
            </select>
          </div>
          <div>
            <label class="block text-[#5F5F5F] font-semibold mb-1">Preferred Date</label>
            <input type="date" required class="w-full border border-[#D7D0C5] rounded p-3 outline-none focus:border-[#C7A76C]">
          </div>
        </div>

        <div>
          <label class="block text-xs text-[#5F5F5F] font-semibold mb-1">Special Design Requests or Notes</label>
          <textarea rows="4" placeholder="Tell our master goldsmiths about your vision..." class="w-full border border-[#D7D0C5] rounded p-3 text-xs outline-none focus:border-[#C7A76C]"></textarea>
        </div>

        <button type="submit" class="w-full gold-btn py-4 rounded text-xs font-semibold uppercase tracking-widest text-center shadow-lg">
          CONFIRM PRIVATE APPOINTMENT
        </button>
      </form>
      <p id="atelier-status" class="text-xs text-[#6F8F72] text-center font-semibold hidden"></p>
    </div>
  </main>

  <!-- Footer & Modals -->
  <div id="footer-container"></div>
  <div id="cart-drawer-container"></div>

  <!-- Entry Script -->
</body>
</html>
