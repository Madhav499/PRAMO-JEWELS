<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure Checkout | Pramo Jewels</title>
  <meta name="description" content="Complete your order for Pramo Jewels fine jewellery with insured express shipping and 256-bit encrypted checkout.">
  <link rel="stylesheet" href="../src/styles/main.css">
</head>
<body class="bg-[#F8F6F2] text-[#1F1F1F]">

  <!-- Header Placeholder -->
  <div id="header-container"></div>

  <section class="bg-[#EDE7DD] py-8 px-4 border-b border-[#D7D0C5] text-center">
    <span class="text-xs uppercase tracking-widest text-[#9E7C42] font-semibold">256-BIT ENCRYPTED CHECKOUT</span>
    <h1 class="font-serif text-3xl font-light text-[#1F1F1F] mt-1">Complete Your Order</h1>
  </section>

  <main class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
    <div id="checkout-layout" class="grid grid-cols-1 lg:grid-cols-3 gap-10">
      
      <!-- Checkout Form (Step 1 to 3) -->
      <div class="lg:col-span-2 space-y-8">
        <form id="checkout-form" class="space-y-8">
          
          <!-- Shipping Address -->
          <div class="bg-white p-6 rounded-lg border border-[#D7D0C5] space-y-4">
            <h3 class="font-serif text-lg font-semibold text-[#1F1F1F] pb-3 border-b border-[#EDE7DD]">
              1. Contact & Insured Shipping Address
            </h3>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-xs">
              <div>
                <label class="block text-[#5F5F5F] mb-1 font-medium">Full Name</label>
                <input type="text" id="c-name" required value="Lady Eleanor Vance" class="w-full border border-[#D7D0C5] rounded p-2.5 outline-none focus:border-[#C7A76C]">
              </div>
              <div>
                <label class="block text-[#5F5F5F] mb-1 font-medium">Email Address</label>
                <input type="email" id="c-email" required value="eleanor.vance@luxury.com" class="w-full border border-[#D7D0C5] rounded p-2.5 outline-none focus:border-[#C7A76C]">
              </div>
              <div>
                <label class="block text-[#5F5F5F] mb-1 font-medium">Phone Number (for Courier Dispatch)</label>
                <input type="tel" id="c-phone" required value="+1 (555) 234-5678" class="w-full border border-[#D7D0C5] rounded p-2.5 outline-none focus:border-[#C7A76C]">
              </div>
              <div>
                <label class="block text-[#5F5F5F] mb-1 font-medium">City / State</label>
                <input type="text" id="c-city" required value="New York, NY" class="w-full border border-[#D7D0C5] rounded p-2.5 outline-none focus:border-[#C7A76C]">
              </div>
              <div class="sm:col-span-2">
                <label class="block text-[#5F5F5F] mb-1 font-medium">Street Address</label>
                <input type="text" id="c-address" required value="740 Park Avenue, Apt 14B" class="w-full border border-[#D7D0C5] rounded p-2.5 outline-none focus:border-[#C7A76C]">
              </div>
            </div>
          </div>

          <!-- Payment Options -->
          <div class="bg-white p-6 rounded-lg border border-[#D7D0C5] space-y-4">
            <h3 class="font-serif text-lg font-semibold text-[#1F1F1F] pb-3 border-b border-[#EDE7DD]">
              2. Secure Payment Gateway
            </h3>

            <div class="space-y-3 text-xs">
              <label class="flex items-center gap-3 p-3 border border-[#C7A76C] rounded bg-[#EDE7DD] cursor-pointer">
                <input type="radio" name="pay" checked class="accent-[#C7A76C]">
                <div>
                  <span class="font-semibold text-[#1F1F1F]">Credit / Debit Card (3D Secure)</span>
                  <p class="text-[10px] text-[#5F5F5F]">Visa, Mastercard, American Express</p>
                </div>
              </label>

              <label class="flex items-center gap-3 p-3 border border-[#D7D0C5] rounded cursor-pointer hover:bg-[#EDE7DD]">
                <input type="radio" name="pay" class="accent-[#C7A76C]">
                <div>
                  <span class="font-semibold text-[#1F1F1F]">Instant UPI / Net Banking</span>
                  <p class="text-[10px] text-[#5F5F5F]">Google Pay, PhonePe, HDFC, ICICI</p>
                </div>
              </label>

              <label class="flex items-center gap-3 p-3 border border-[#D7D0C5] rounded cursor-pointer hover:bg-[#EDE7DD]">
                <input type="radio" name="pay" class="accent-[#C7A76C]">
                <div>
                  <span class="font-semibold text-[#1F1F1F]">Cash on Delivery (Insured OTP Verification)</span>
                  <p class="text-[10px] text-[#5F5F5F]">Available for orders up to $10,000</p>
                </div>
              </label>
            </div>
          </div>

          <button type="submit" class="w-full gold-btn py-4 rounded text-xs font-semibold uppercase tracking-widest text-center shadow-xl">
            PLACE ORDER & PAY NOW
          </button>
        </form>
      </div>

      <!-- Order Summary Card -->
      <div class="bg-white p-6 rounded-lg border border-[#D7D0C5] h-fit space-y-6">
        <h3 class="font-serif text-lg font-semibold text-[#1F1F1F] pb-3 border-b border-[#EDE7DD]">
          Order Summary
        </h3>

        <div id="checkout-items" class="max-h-80 overflow-y-auto"></div>

        <div class="space-y-2 pt-4 border-t border-[#D7D0C5] text-xs">
          <div class="flex justify-between text-[#5F5F5F]">
            <span>Items Subtotal</span>
            <span id="checkout-subtotal" class="font-semibold text-[#1F1F1F]">$0</span>
          </div>
          <div class="flex justify-between text-[#5F5F5F]">
            <span>Insured Air Courier</span>
            <span class="font-semibold text-[#6F8F72]">FREE</span>
          </div>
          <div class="flex justify-between text-base font-serif font-bold text-[#1F1F1F] pt-3 border-t border-[#EDE7DD]">
            <span>Total Payable</span>
            <span id="checkout-[#total]">$0</span>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer & Modals -->
  <div id="footer-container"></div>
  <div id="cart-drawer-container"></div>

  <!-- Entry Script -->
  <script type="module">
    import { renderHeader } from '../src/components/header.js';
    import { renderFooter } from '../src/components/footer.js';
    import { renderCartDrawer } from '../src/components/modal.js';
    import { CheckoutEngine } from '../src/scripts/checkout.js';

    document.addEventListener('DOMContentLoaded', () => {
      renderHeader();
      renderFooter();
      renderCartDrawer();
      CheckoutEngine.init();
    });
  </script>
</body>
</html>
